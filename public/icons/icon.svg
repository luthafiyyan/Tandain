<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Paper Shadow -->
    <filter id="paperShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <!-- Fold Shadow -->
    <filter id="foldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- App Canvas Squircle (Dark Ink Slate) -->
  <rect width="512" height="512" rx="116" fill="#14161C"/>
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#262A36" stroke-width="4"/>

  <!-- Document Sheet (Warm Paper) with Folded Corner -->
  <g filter="url(#paperShadow)">
    <!-- Base Document Path with chamfered top-right corner -->
    <path d="M 124 96 C 124 82.7 134.7 72 148 72 L 316 72 L 388 144 L 388 416 C 388 429.3 377.3 440 364 440 L 148 440 C 134.7 440 124 429.3 124 416 Z" fill="#F6F2EA"/>
    
    <!-- Folded Corner Flap -->
    <path d="M 316 72 L 388 144 L 328 144 C 321.4 144 316 138.6 316 132 Z" fill="#E2DBD0" filter="url(#foldShadow)"/>
  </g>

  <!-- Sensitive Document Text Lines (Simulasi Dokumen KTP/Ijazah) -->
  <g fill="#D8D0C4">
    <!-- Header lines -->
    <rect x="156" y="112" width="116" height="12" rx="6"/>
    <rect x="156" y="134" width="84" height="10" rx="5" fill="#E3DDD3"/>
    
    <!-- Body lines -->
    <rect x="156" y="176" width="198" height="9" rx="4.5" fill="#E8E2D8"/>
    <rect x="156" y="196" width="168" height="9" rx="4.5" fill="#E8E2D8"/>
    <rect x="156" y="216" width="186" height="9" rx="4.5" fill="#E8E2D8"/>
    <rect x="156" y="236" width="144" height="9" rx="4.5" fill="#E8E2D8"/>
  </g>

  <!-- Official Stamp Seal (Cap Segel Merah Tandain dengan Monogram T) -->
  <!-- Angled by -9 degrees for authentic stamped look -->
  <g transform="translate(256, 324) rotate(-9)">
    <!-- Stamp Fill & Outer Solid Border -->
    <rect x="-106" y="-54" width="212" height="108" rx="14" fill="#C8372D" fill-opacity="0.08" stroke="#C8372D" stroke-width="6"/>
    
    <!-- Stamp Inner Dashed Security Border -->
    <rect x="-95" y="-43" width="190" height="86" rx="9" fill="none" stroke="#C8372D" stroke-width="2.5" stroke-dasharray="7 5"/>
    
    <!-- Top & Bottom Micro-Header -->
    <text x="0" y="-27" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="700" fill="#C8372D" text-anchor="middle" letter-spacing="3.5">DOKUMEN TERVERIFIKASI</text>
    
    <!-- Decorative Stars -->
    <path d="M -56 5 L -54 0 L -49 0 L -53 -3 L -51 -8 L -56 -5 L -61 -8 L -59 -3 L -63 0 L -58 0 Z" fill="#C8372D" transform="scale(0.8)"/>
    <path d="M 56 5 L 58 0 L 63 0 L 59 -3 L 61 -8 L 56 -5 L 51 -8 L 53 -3 L 49 0 L 54 0 Z" fill="#C8372D" transform="scale(0.8)"/>
    
    <!-- Bold Stamp Monogram "T" -->
    <path d="M -22 -12 H 22 V -4 H 5 V 23 H -5 V -4 H -22 Z" fill="#C8372D"/>
    
    <!-- Bottom Micro-Caption -->
    <text x="0" y="32" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#C8372D" text-anchor="middle" letter-spacing="3">100% OFFLINE</text>
  </g>
</svg>
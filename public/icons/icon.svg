  <path d="M160 120 C160 106.745 170.745 96 184 96 L296 96 L352 152 L352 392 C352 405.255 341.255 416 328 416 L184 416 C170.745 416 160 405.255 160 392 Z" fill="#ffffff" filter="drop-shadow(0 16px 24px rgba(0,0,0,0.15))"/>
